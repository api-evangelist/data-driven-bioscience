name: Data Driven Bioscience
description: 'Data Driven Bioscience (now operating as Duoseq, a ddb.bio service) is a cancer genomics
  testing company that performs comprehensive molecular profiling of both DNA and RNA from a single
  sample in an on-site workflow, delivering results from sample to report in roughly two days. Its
  platform detects mutations, expression levels, gene fusions, and clonotype information, and integrates
  directly with Epic and other leading EHR systems so results flow into the patient chart. The company
  is a portfolio company of initialized-capital and was added to the API Evangelist network as a stub
  for enrichment; as of this pass it publishes a marketing/clinical website but no public developer or
  API surface.'
